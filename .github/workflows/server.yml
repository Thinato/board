# Tests the server on every push and pull request; on main, builds the image and deploys it to Cloud Run.
#
# Authenticates by Workload Identity Federation: no service-account key exists anywhere. The WIF
# provider (infra/main.tf) accepts only main-branch runs of this repository.

name: Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  IMAGE: southamerica-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/board/server:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job can mint the OIDC token for WIF, so test code and its dependencies can't deploy.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      # The model layer (download 434 MB + quantize) only rebuilds when setup-model.sh changes.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the image changes here; memory, scaling, timeout etc. are Terraform's (infra/main.tf).
      - name: Deploy
        run: gcloud run services update board --region "$REGION" --image "$IMAGE" --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke test the live service
        working-directory: server
        run: |
          npm ci --omit=dev
          node test/smoke.js "$(gcloud run services describe board --region "$REGION" --format 'value(status.url)')"
