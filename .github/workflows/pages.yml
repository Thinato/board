# Publishes web/ to GitHub Pages. Served at lisecki.dev/board/ because the user site
# Thinato/thinato.github.io carries the lisecki.dev domain and project sites inherit it.
# Only the page's three files are uploaded: server/, infra/ and any Slido export can't leak through the site.

name: Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish an allowlist, not the folder: nothing else that lands in web/ (say, a renamed
      # Slido export with real meeting questions) can reach the site.
      - name: Collect the page
        run: mkdir _site && cp web/index.html web/app.js web/style.css _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
